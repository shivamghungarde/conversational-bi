<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Your Data</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="genie" viewBox="0 0 32 32" aria-hidden="true">
        <path class="spark" d="M9 3.5l.9 2.4 2.4.9-2.4.9L9 10.1l-.9-2.4-2.4-.9 2.4-.9z"/>
        <path class="spark small" d="M14.5 7l.45 1.2 1.2.45-1.2.45-.45 1.2-.45-1.2-1.2-.45 1.2-.45z"/>
        <path d="M3.5 18.5c3.2.2 5.6-.8 7.6-2.6h10.2c1.6 2 3.6 2.9 6.2 2.7-1 2.7-4.1 4.4-8.3 4.4h-6.1c-3.6 0-6.8-1.6-9.6-4.5z"/>
        <path d="M24.6 16.3c2.6-1.1 4.3.6 3.3 2.6"/>
        <path d="M13 15.9c0-2 1.3-3.5 3-3.5s3 1.5 3 3.5"/>
        <path d="M12.6 23.2h6.8M14.2 26h3.6"/>
      </svg>
      Ask Your Data <span class="demo-label">Synthetic demo</span>
    </div>
    <div class="meta">
      <button id="sources-btn" class="sources-btn" type="button" title="Connected data sources">
        <span class="dot" aria-hidden="true"></span><span id="sources-text">Sources</span>
      </button>
      <button id="help-btn" class="icon-btn" type="button" aria-label="What can I ask?" title="What can I ask?">?</button>
    </div>
  </header>

  <main id="scroller">
    <section id="empty" class="empty">
      <h1>What would you like to know?</h1>
      <div id="starters" class="starters"></div>
    </section>
    <section id="thread" class="thread" aria-live="polite"></section>
  </main>

  <footer class="composer">
    <form id="ask-form" autocomplete="off">
      <label for="source" class="sr-only">Data source</label>
      <select id="source" class="source-pick" title="Which data source answers"></select>
      <label for="question" class="sr-only">Ask a question about your data</label>
      <input id="question" name="question" type="text" maxlength="500" placeholder="Ask anything about your data…">
      <button type="submit" id="ask-btn" aria-label="Ask">Ask</button>
    </form>
    <div class="composer-hint">Press <kbd>Alt + Enter</kbd> to use the suggestion · answers come from your data, on this machine</div>
  </footer>

  <dialog id="help">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <h2>What you can ask</h2>
    <div id="help-body"></div>
  </dialog>

  <dialog id="sources">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <h2>Connected data sources</h2>
    <p class="dialog-sub">Choose <b>All sources</b> in the question bar to let each question find its source, or pick one to focus.</p>
    <div id="sources-list" class="sources-list"></div>
    <div class="help-upload">
      <label class="synthetic-confirm"><input id="synthetic-confirm" type="checkbox"> This file contains synthetic data only</label>
      <button id="upload-btn" class="soft-btn" type="button" disabled>Add a CSV or Excel file</button>
      <input id="upload" type="file" accept=".csv,.xlsx" hidden>
    </div>
  </dialog>

  <template id="msg-user">
    <div class="msg user"><div class="bubble"></div></div>
  </template>

  <template id="msg-bot">
    <article class="msg bot">
      <div class="body">
        <div class="answer"></div>
        <div class="options"></div>
        <div class="viz"></div>
        <div class="meta-row">
          <button type="button" class="link-btn explore-btn" hidden>Explore</button>
          <span class="source-tag" hidden></span>
          <button type="button" class="link-btn refresh" hidden title="Re-run against the latest data">Refresh</button>
          <span class="asof"></span>
        </div>
        <div class="explore" hidden>
          <div class="chips"></div>
          <div class="controls"></div>
          <div class="explore-viz"></div>
          <div class="table-head"><span class="table-title"></span><button type="button" class="link-btn csv">Download CSV</button></div>
          <div class="table-scroll"><table></table></div>
          <div class="next"></div>
          <details class="sql-wrap"><summary>Show steps</summary><ol class="steps"></ol><pre class="sql"></pre></details>
        </div>
      </div>
    </article>
  </template>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>

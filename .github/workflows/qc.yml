name: QC
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock 'ruff>=0.8,<1'
      - run: ruff check bi tests
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qc_synthetic_only
          POSTGRES_DB: bi_qc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p test_postgres.py -v
        env:
          BI_TEST_POSTGRES_URL: postgresql://postgres:qc_synthetic_only@127.0.0.1:5432/bi_qc

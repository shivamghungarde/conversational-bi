[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-bi"
version = "0.4.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pgdemo = ["psycopg[binary]>=3.2,<4", "pgserver>=0.1.4,<1"]  # embedded PostgreSQL for laptop demos and tests
dev = ["ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["bi*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
